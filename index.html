<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mini Market</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="encabezado">
    <h1>Mini Market</h1>
  </div>
  <div id="contenedor">
    <div id="filtros">
      <h2>Filtros</h2>
      <div id="controles">
        <label for="busqueda">Buscar producto</label>
        <input class="campo" id="busqueda" type="text" placeholder="Nombre del producto">
        <label for="categoria">Categoría</label>
        <select class="campo" id="categoria">
          <option value="todas">Todas</option>
          <option value="groceries">Almacén</option>
          <option value="beauty">Belleza</option>
          <option value="skin-care">Cuidado personal</option>
          <option value="home-decoration">Hogar</option>
          <option value="kitchen-accessories">Cocina</option>
        </select>
        <label for="precio">
          Precio máximo: $<span id="valor-precio">90</span>
        </label>
        <input id="precio" type="range" min="0" max="90" value="90" step="1">
        <label for="orden">Ordenar por</label>
        <select class="campo" id="orden">
          <option value="original">Orden original</option>
          <option value="menor">Menor precio</option>
          <option value="mayor">Mayor precio</option>
          <option value="nombre">Nombre</option>
        </select>
        <button class="boton-ancho" id="limpiar">
          Limpiar filtros
        </button>
      </div>
    </div>

    <div id="catalogo">
      <h2>Productos</h2>
      <p id="resultados">Cargando productos...</p>
      <button id="reintentar" hidden>Reintentar</button>
      <div id="productos"></div>
    </div>
    <div id="carrito">
      <h2>Carrito</h2>
      <div id="lista-carrito">
        El carrito está vacío.
      </div>
      <p class="total">
        Total: <span id="total">$0,00</span>
      </p>
      <button class="boton-ancho" id="vaciar" disabled>
        Vaciar carrito
      </button>
      <p id="error-guardado" hidden>
        No se pudo guardar el carrito en este navegador.
      </p>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
